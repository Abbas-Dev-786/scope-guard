services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: scopeguard
      POSTGRES_USER: scopeguard
      POSTGRES_PASSWORD: scopeguard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scopeguard -d scopeguard"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - scopeguard-postgres:/var/lib/postgresql/data

volumes:
  scopeguard-postgres:
