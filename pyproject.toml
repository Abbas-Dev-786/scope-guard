[project]
name = "scopeguard"
version = "0.1.0"
description = "Evidence-backed scope change management for software freelancers"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "bedrock-agentcore>=1.0,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "boto3>=1.40,<2",
  "httpx>=0.28,<1",
  "mangum>=0.19,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "strands-agents>=1.0,<2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bedrock-agentcore-starter-toolkit>=0.2,<1",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["migrations/"]
